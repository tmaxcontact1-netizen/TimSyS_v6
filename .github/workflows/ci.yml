name: TimSyS CI

on:
  push:
    branches: [main, adapter-crypto-playbook]
  pull_request:

jobs:
  outcome-blind-measurements:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: node --test apps/memecoined/tools/playbook-measurements.test.cjs apps/memecoined/tools/playbook-selection.test.cjs
  isolation-regression:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Verify dependency-free isolation and recovery
        run: node --test apps/memecoined/tools/validation-watchdog.test.cjs apps/memecoined/tools/isolation-shutdown.test.cjs
  regression-suite:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            platform/package-lock.json
            apps/*/package-lock.json
      - name: Install locked workspace dependencies
        run: node scripts/workspace.mjs install
      - name: Run tests and production builds
        run: npm run verify
      - name: Verify isolated validation watchdog recovery
        run: node --test apps/memecoined/tools/validation-watchdog.test.cjs apps/memecoined/tools/isolation-shutdown.test.cjs
