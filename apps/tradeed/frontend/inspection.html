<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trade’Ed · Inspection</title><style>
:root{--workspace-bg:#12101b;--workspace-surface:#1b1728;--workspace-raised:#251e35;--workspace-border:#3c3151;--workspace-text:#f4effc;--workspace-muted:#bdb0cf;--workspace-accent:#c3a5ff;--workspace-focus:#b393ff}
:root[data-theme=light]{--workspace-bg:#f6f2fb;--workspace-surface:#fff;--workspace-raised:#eee6f8;--workspace-border:#d9cbea;--workspace-text:#2d203d;--workspace-muted:#6d5c7e;--workspace-accent:#7044aa;--workspace-focus:#8051c0}
.workspace-bar{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;min-height:62px;padding:10px 24px;background:var(--workspace-surface);border-bottom:1px solid var(--workspace-border);color:var(--workspace-text);font:14px/1.4 Inter,"Segoe UI",system-ui,sans-serif}
.workspace-bar__navigation,.workspace-bar__actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.workspace-bar__identity{display:flex;align-items:baseline;gap:10px;flex:1}.workspace-bar__identity strong{font-size:16px;letter-spacing:-.02em}.workspace-bar__identity small{color:var(--workspace-muted);font-size:12px}.workspace-bar button,.workspace-bar a{min-height:36px;padding:7px 11px;border:1px solid var(--workspace-border);border-radius:7px;background:transparent;color:var(--workspace-text);font:inherit;text-decoration:none;cursor:pointer}.workspace-bar button:hover:not(:disabled),.workspace-bar a:hover{background:var(--workspace-raised);border-color:var(--workspace-accent)}.workspace-bar button:disabled{opacity:.45;cursor:default}.workspace-bar :focus-visible{outline:2px solid var(--workspace-focus);outline-offset:3px}.workspace-bar .workspace-bar__launcher{color:var(--workspace-accent)}
.workspace-menu{position:relative}.workspace-menu>button[aria-expanded=true]{background:var(--workspace-raised)}.workspace-menu__items{position:absolute;right:0;top:calc(100% + 8px);display:grid;gap:4px;min-width:230px;max-width:calc(100vw - 32px);padding:8px;border:1px solid var(--workspace-border);border-radius:10px;background:var(--workspace-surface);box-shadow:0 12px 36px #0005}.workspace-menu__items button{text-align:left;border-color:transparent}.workspace-menu__items hr{width:100%;border:0;border-top:1px solid var(--workspace-border);margin:4px 0}.workspace-bar__notice{flex-basis:100%;margin:0;color:var(--workspace-muted);font-size:13px}
.workspace-dialog{width:min(720px,calc(100vw - 32px));max-height:85vh;overflow:auto;border:1px solid var(--workspace-border);border-radius:14px;background:var(--workspace-surface);color:var(--workspace-text);box-shadow:0 24px 80px #0007;padding:24px}.workspace-dialog::backdrop{background:#100a1ec9}.workspace-dialog header{display:flex;align-items:center;justify-content:space-between;gap:20px}.workspace-dialog header h2{margin:0}.workspace-dialog header button{padding:8px 12px;color:inherit;background:var(--workspace-raised);border:1px solid var(--workspace-border);border-radius:6px}
@media(max-width:700px){.workspace-bar{padding:10px 14px;gap:10px}.workspace-bar__identity{order:-1;flex-basis:100%}.workspace-bar__navigation,.workspace-bar__actions{gap:6px}.workspace-bar__actions{margin-left:auto}}
@media print{.workspace-bar{display:none!important}}

*{box-sizing:border-box}body{margin:0;background:var(--workspace-bg);color:var(--workspace-text);font:15px/1.55 Inter,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}.inspection{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 62px)}.inspection-sidebar{background:#181221;padding:24px 14px;border-right:1px solid var(--workspace-border)}.inspection-sidebar nav{display:grid;gap:6px}.inspection-sidebar button{padding:11px 14px;text-align:left;background:transparent;color:var(--workspace-muted);border:1px solid transparent;border-radius:8px}.inspection-sidebar button:hover,.inspection-sidebar button[aria-current=page]{background:#352348;color:#dfc5ff;border-color:#654778}.inspection-content{padding:36px;max-width:1300px;width:100%;min-width:0}h1{margin:8px 0;font-size:30px;letter-spacing:-.03em}h2{font-size:18px}.eyebrow{color:var(--workspace-accent);font-size:12px;letter-spacing:.12em;text-transform:uppercase}.muted{color:var(--workspace-muted)}.inspection-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:28px 0}.inspection-card,.inspection-result{padding:22px;background:var(--workspace-surface);border:1px solid var(--workspace-border);border-radius:12px}.inspection-card{text-align:left;color:inherit}.inspection-card:hover{border-color:var(--workspace-accent)}.inspection-card strong,.inspection-card span{display:block}.inspection-card strong{font-size:17px;margin-bottom:10px}.inspection-card span{color:var(--workspace-muted);font-size:13px}.inspection-result dl{display:grid;grid-template-columns:minmax(120px,1fr) 2fr;gap:12px}.inspection-result dt{color:var(--workspace-muted)}.inspection-result dd{margin:0;overflow-wrap:anywhere}.inspection-result pre{max-height:60vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;color:#d6c1ed}summary{cursor:pointer;color:var(--workspace-accent)}.inspection-badge{display:inline-block;border:1px solid #6d5388;color:#d3b2ff;border-radius:999px;padding:4px 10px;font-size:12px}.inspection-content:focus{outline:none}button:focus-visible,summary:focus-visible{outline:2px solid var(--workspace-focus);outline-offset:3px}@media(max-width:700px){.inspection{display:block}.inspection-sidebar{border-right:0;border-bottom:1px solid var(--workspace-border);padding:12px}.inspection-sidebar nav{display:flex;overflow:auto}.inspection-sidebar button{white-space:nowrap}.inspection-content{padding:22px 16px}}
.workspace-menu>summary{list-style:none;min-height:36px;padding:7px 11px;border:1px solid var(--workspace-border);border-radius:7px}.workspace-menu>summary:focus-visible{outline:2px solid var(--workspace-focus);outline-offset:3px}</style></head><body>
<header class="workspace-bar"><div class="workspace-bar__navigation"><button id="back">← Back</button><button id="launcher" class="workspace-bar__launcher">Return to launcher</button></div><div class="workspace-bar__identity"><strong>Trade’Ed</strong><small>Inspection only.</small></div><div class="workspace-bar__actions"><span class="inspection-badge">Read-only</span><div id="browser-menus" style="display:flex;gap:8px"><details class="workspace-menu"><summary>File</summary><div class="workspace-menu__items"><button id="menu-back">Back</button><button id="menu-launcher">Return to launcher</button></div></details><details class="workspace-menu"><summary>AI integration</summary><div class="workspace-menu__items"><button id="menu-assistant">Open assistant</button><button id="menu-ai-settings">Connections and models…</button></div></details></div></div></header>
<div class="inspection"><aside class="inspection-sidebar"><nav aria-label="Trade’Ed pages" id="navigation"></nav></aside><main class="inspection-content" id="content" tabindex="-1"></main></div>
<script>
const pages=[
{id:'overview',label:'Overview',description:'Saved evidence and service inspection.'},
{id:'operations',label:'Operations',route:'operations/status',description:'Inspect service availability and recorded operating state.'},
{id:'pipeline',label:'Pipeline',route:'paper/pipeline',description:'Review the saved evaluation pipeline.'},
{id:'strategy',label:'Strategy evidence',route:'paper/strategy-funnel',description:'Inspect recorded strategy decisions and filters.'},
{id:'dashboard',label:'Dashboard',route:'focused-dashboard',description:'Review the existing dashboard snapshot.'},
{id:'opportunities',label:'Opportunity audit',route:'paper/opportunity-audit',description:'Inspect recorded opportunities and their evidence.'},
{id:'snapshot',label:'Paper snapshot',route:'paper/snapshot',description:'Read the saved paper-trading snapshot.'},
{id:'watchlists',label:'Watchlists',route:'watchlists',description:'Inspect existing watchlist records.'}];
let active='overview',previous=[],controller;
const el=(tag,text,css)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(css)n.className=css;return n;};
const title=s=>s.replaceAll('_',' ').replaceAll(/([a-z])([A-Z])/g,'$1 $2');
function back(){show(previous.pop()||'overview',false);}
async function launcher(){try{if(window.electronAPI?.returnToLauncher)await window.electronAPI.returnToLauncher();else document.getElementById('content').prepend(el('p','Return to the TimSyS desktop launcher to switch apps.','muted'));}catch(e){document.getElementById('content').prepend(el('p',e.message));}}
async function show(id,record=true){
 if(record&&id!==active)previous.push(active);active=id;controller?.abort();controller=new AbortController();
 const page=pages.find(p=>p.id===id)||pages[0],content=document.getElementById('content');content.replaceChildren(el('div','Trade’Ed workspace','eyebrow'),el('h1',page.label),el('p',page.description,'muted'));
 for(const button of document.querySelectorAll('[data-page]')){if(button.dataset.page===id)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');}
 document.getElementById('back').disabled=!previous.length&&id==='overview';
 if(id==='overview'){
 content.append(el('p','This workspace reads existing evidence. It cannot start validation, trading or market collection.','muted'));
 const cards=el('div',null,'inspection-cards');for(const p of pages.slice(1)){const b=el('button',null,'inspection-card');b.append(el('strong',p.label+' →'),el('span',p.description));b.onclick=()=>show(p.id);cards.append(b);}content.append(cards);return;
 }
 const status=el('p','Loading saved evidence…','muted');status.setAttribute('role','status');content.append(status);content.focus({preventScroll:true});
 try{const response=await fetch('/api/timsys/v1/apps/tradeed/backend/1.0.0/'+page.route+'?limit=20',{signal:AbortSignal.any([controller.signal,AbortSignal.timeout(2000)])});const result=await response.json();if(active!==id)return;
 status.textContent=response.ok?'Saved evidence loaded.':'This source is currently unavailable. No restart was attempted.';
 const section=el('section',null,'inspection-result'),data=result.data??result;
 const items=Array.isArray(data)?[['Records',data.length]]:Object.entries(data??{});const list=el('dl');for(const [key,value] of items){list.append(el('dt',title(key)),el('dd',value==null?'Not recorded':Array.isArray(value)?value.length+' records':typeof value==='object'?'Available in the evidence record below':String(value)));}section.append(list);
 const details=el('details'),summary=el('summary','View the complete evidence record');details.append(summary,el('pre',JSON.stringify(result,null,2)));section.append(details);content.append(section);
 }catch(error){if(active!==id||error.name==='AbortError')return;status.textContent='Read unavailable. No worker was started and no retry was performed.';}
}
for(const page of pages){const b=el('button',page.label);b.dataset.page=page.id;b.onclick=()=>show(page.id);document.getElementById('navigation').append(b);}
const closeMenus=()=>document.querySelectorAll('.workspace-menu[open]').forEach(m=>m.removeAttribute('open'));
if(window.electronAPI?.windows)document.getElementById('browser-menus').remove();else{
document.getElementById('menu-back').onclick=()=>{closeMenus();back();};document.getElementById('menu-launcher').onclick=()=>{closeMenus();void launcher();};
const ai=async settings=>{closeMenus();try{const bridge=window.electronAPI?.assistant;if(bridge)await(settings?bridge.openSettings():bridge.open());else document.getElementById('content').prepend(el('p','Open AI integration from the TimSyS desktop launcher.','muted'));}catch(e){document.getElementById('content').prepend(el('p',e.message));}};
document.getElementById('menu-assistant').onclick=()=>ai(false);document.getElementById('menu-ai-settings').onclick=()=>ai(true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenus();});}
document.getElementById('back').onclick=back;document.getElementById('launcher').onclick=launcher;
window.addEventListener('timsys:navigate-back',e=>{e.preventDefault();back();});window.addEventListener('timsys:return-launcher',e=>{e.preventDefault();void launcher();});show('overview',false);
</script></body></html>
